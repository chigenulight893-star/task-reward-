<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskReward</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f7f9;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #0b7a4b;
      color: white;
      border: none;
      border-radius: 6px;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>TaskReward</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="registerUser()">
    Create Account
  </button>

  <p id="message"></p>

</div>

<script>

const SUPABASE_URL =
"https://ztvliwkztcxmdoidowxn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_QrM6y6lTW4M63DaGzO28_g_NeePqlwb";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function registerUser() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if (!email || !password) {

    message.innerText =
      "Please enter your email and password.";

    return;
  }


  message.innerText =
    "Creating account...";


  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password

    });


  if (error) {

    message.innerText =
      "Error: " + error.message;

    return;
  }


  message.innerText =
    "Account created! Check your email if confirmation is required.";

}

</script>

</body>
</html>
