<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskReward</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f6;
  color:#17201d;
}

.container{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#fff;
}

header{
  background:#087f5b;
  color:#fff;
  padding:20px 18px;
  border-radius:0 0 20px 20px;
}

header h1{
  font-size:24px;
}

.top-user{
  margin-top:7px;
  font-size:14px;
}

.header-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.header-actions button{
  width:auto;
  margin:0;
  padding:9px 13px;
}

.content{
  padding:18px;
}

.balance{
  background:#e9f8f2;
  padding:20px;
  border-radius:15px;
  margin-bottom:18px;
}

.balance small{
  color:#52615c;
}

.balance h2{
  margin-top:8px;
  font-size:30px;
  color:#087f5b;
}

.activation{
  background:#fff4d6;
  border:1px solid #f0d58a;
  padding:18px;
  border-radius:15px;
  margin-bottom:18px;
}

.activation h3{
  margin-bottom:8px;
}

button{
  border:none;
  padding:13px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:12px;
}

.primary{
  background:#087f5b;
  color:white;
  width:100%;
}

.secondary{
  background:#e9f8f2;
  color:#087f5b;
  width:100%;
}

.danger{
  background:#ffe5e5;
  color:#b42318;
  width:100%;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.menu button{
  margin:0;
  background:#f1f4f3;
  color:#17201d;
}

.card{
  background:white;
  border:1px solid #e3e8e6;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.card h3{
  margin-bottom:8px;
}

.locked{
  text-align:center;
  padding:30px 15px;
  color:#66736e;
}

input{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:1px solid #ccd5d1;
  border-radius:9px;
  outline:none;
}

label{
  display:block;
  margin-top:12px;
  font-size:14px;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

.auth{
  padding:30px 20px;
  min-height:100vh;
  display:flex;
  align-items:center;
}

.auth-box{
  width:100%;
}

.auth-box h1{
  color:#087f5b;
  margin-bottom:8px;
}

.auth-box p{
  color:#65716d;
  margin-bottom:20px;
}

.error{
  color:#b42318;
  margin-top:10px;
  font-size:14px;
}

.success{
  color:#087f5b;
  margin-top:10px;
  font-size:14px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.inactive{
  background:#fff0c2;
  color:#806000;
}

.active{
  background:#d9f7eb;
  color:#087f5b;
}

.task{
  margin-top:12px;
  padding:15px;
  border:1px solid #e1e6e4;
  border-radius:12px;
}

.task p{
  margin-top:5px;
  color:#66736e;
  font-size:14px;
}

.task strong{
  color:#087f5b;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.auth-title{
  text-align:center;
  margin-bottom:20px;
}

.small-note{
  font-size:13px;
  color:#66736e;
  margin-top:8px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authPage" class="auth">
  <div class="auth-box">

    <div class="auth-title">
      <h1>TaskReward</h1>
      <p>Complete available tasks and manage your account.</p>
    </div>

    <div class="card">

      <input id="fullName"
        type="text"
        placeholder="Full name">

      <input id="email"
        type="email"
        placeholder="Email address">

      <input id="password"
        type="password"
        placeholder="Password">

      <button class="primary" onclick="signUp()">
        Create Account
      </button>

      <button class="secondary" onclick="login()">
        Login
      </button>

      <div id="authMessage"></div>

    </div>

  </div>
</div>


<!-- APP -->
<div id="app" class="container hidden">

<header>

  <h1>TaskReward</h1>

  <div class="top-user">
    Welcome, <span id="userName">User</span>
  </div>

  <div class="header-actions">

    <button
      class="danger"
      onclick="logout()">
      🚪 Logout
    </button>

  </div>

</header>


<div class="content">

<!-- BALANCE -->
<div class="balance">

  <small>Available Balance</small>

  <h2
